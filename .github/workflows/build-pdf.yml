name: Build CV PDF

on:
  push:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF renderer
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render PDF
        run: node scripts/render-pdf.cjs

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV-Jeronimo-Herdoiza_Cloud-DevOps-Infrastructure.pdf

          if git diff --cached --quiet; then
            echo "PDF is unchanged"
          else
            git commit -m "chore: update generated CV PDF"
            git push
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: CV-Jeronimo-Herdoiza_Cloud-DevOps-Infrastructure.pdf
          if-no-files-found: error