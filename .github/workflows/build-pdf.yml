name: Build CV PDF

on:
  push:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Roboto font
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto

      - name: Install PDF renderer
        run: npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome

      - name: Check Chrome version
        run: google-chrome --version

      - name: Render PDF fr
        run: node scripts/render-pdf.cjs

      - name: Render PDF en
        run: node scripts/render-pdf.cjs en

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV-FR-Jeronimo-Herdoiza.pdf
          git add CV-EN-Jeronimo-Herdoiza.pdf

          if git diff --cached --quiet; then
            echo "PDF is unchanged"
          else
            git commit -m "chore: update generated CV PDFs"
            git push
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-fr-pdf
          path: CV-FR-Jeronimo-Herdoiza.pdf
          if-no-files-found: error
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-en-pdf
          path: CV-EN-Jeronimo-Herdoiza.pdf
          if-no-files-found: error